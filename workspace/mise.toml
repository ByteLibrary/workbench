# Workspace-wide settings for ~/ByteLibrary.
# Written by workbench/scripts/write-workspace-files.sh. Change it there, not here.

[env]
# gh uses the ByteLibrary-only login inside the workspace (docs/github-access.md).
GH_CONFIG_DIR = "{{env.HOME}}/.config/gh-bytelibrary"
# pip refuses to install outside a virtual environment: every Python project has its own, managed by uv
# (languages/python.md in the handbook).
PIP_REQUIRE_VIRTUALENV = "true"

[tasks.update]
description = "Update every workspace repository now, as the background update does every 10 minutes"
run = "workbench/scripts/update.py"

[tasks.doctor]
description = "Check tools, GitHub access, the firewall, the handbook's data against GitHub and the workspace"
run = "workbench/scripts/doctor.sh"

[tasks.sign-in]
description = "Sign in through the ByteLibrary Developer Access App again, for example after revoking access"
run = "workbench/scripts/sign-in.sh"

[tasks."firewall:blocked"]
description = "List the sites the firewall refused in the last day"
run = "workbench/scripts/firewall.py blocked"

[tasks."firewall:apply"]
description = "Apply the sites files now; it also happens on its own when they change"
run = "workbench/scripts/firewall.py apply"

[tools]
# Only what the workspace itself needs (ADR-0028). Tools a repository builds, tests or lints with are
# pinned in that repository's mise.toml, so its CI uses the same versions.
gh = "2.102.0"
python = "3.14.8"
shellcheck = "0.11.0"
