# Workspace-wide settings for ~/ByteLibrary.
# Written by workbench/scripts/write-workspace-files.sh. Change it there, not here.

[env]
# gh uses the ByteLibrary-only login inside the workspace (docs/github-access.md).
GH_CONFIG_DIR = "{{env.HOME}}/.config/gh-bytelibrary"

[tasks.update]
description = "Update every workspace repository now, as the background update does every 10 minutes"
run = "workbench/scripts/update.sh"

[tools]
# Only what the workspace itself needs (ADR-0028). Tools a repository builds, tests or lints with are
# pinned in that repository's mise.toml, so its CI uses the same versions.
gh = "2.102.0"
python = "3.14.8"
shellcheck = "0.11.0"
