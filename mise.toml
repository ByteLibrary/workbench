# Workbench's tools and its own commands. The Tests check in CI runs `test`.
[tools]
python = "3.14.8"
uv = "0.12.23"

[tasks.docs]
description = "Regenerate the documentation's views and llms.txt, with the shared generator"
run = "uv run --quiet --frozen --project ../reusable-ci-workflows documentation generate --root ."

[tasks.test]
description = "Test the git hooks, the workspace update and the doctor"
run = [
  "scripts/test-hooks.sh",
  "scripts/test-update.sh",
  "uv run --frozen python -m unittest discover --start-directory tests --top-level-directory .",
]
