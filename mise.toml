# Workbench's own commands. The Tests check in CI runs `test`.
[tasks.test]
description = "Test the git hooks, the workspace update and the doctor"
# The system's Python, which has PyYAML, as the doctor uses.
run = ["scripts/test-hooks.sh", "scripts/test-update.sh", "/usr/bin/python3 -m unittest discover --start-directory scripts --pattern 'test_*.py'"]
