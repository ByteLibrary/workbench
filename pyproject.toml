[project]
name = "bytelibrary-workbench"
version = "0.1.0"
description = "The development machine's doctor."
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
    "pyyaml>=6.0.2",
]

[project.scripts]
doctor = "doctor.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "doctor"

# The organization's settings, from the workspace clone of reusable-ci-workflows, so editors format the
# way the shared Lint check expects.
[tool.ruff]
extend = "../reusable-ci-workflows/ruff.toml"

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260906",
]
