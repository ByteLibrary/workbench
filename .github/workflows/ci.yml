name: CI

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pull-request-standards:
    uses: ByteLibrary/reusable-ci-workflows/.github/workflows/pull-request-standards.yml@main
  documentation:
    uses: ByteLibrary/reusable-ci-workflows/.github/workflows/documentation.yml@main
  shell:
    uses: ByteLibrary/reusable-ci-workflows/.github/workflows/shell.yml@main
  hook-tests:
    name: Hook tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ByteLibrary/reusable-ci-workflows
          path: .rules
          persist-credentials: false
      - name: Test the git hooks
        env:
          RULES_REPOSITORY: .rules
        run: scripts/test-hooks.sh
  setup:
    name: Setup on a fresh machine
    runs-on: ubuntu-24.04
    # Pull requests from forks get no secrets, so they cannot create the CI App's token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      BYTELIBRARY_WORKSPACE_DIR: ${{ github.workspace }}/ByteLibrary
    steps:
      - name: Report whether the runner offers hardware virtualization
        run: |
          if [[ -e /dev/kvm ]]; then
            echo "::notice title=Virtualization::KVM is available on this runner (/dev/kvm exists)"
          else
            echo "::notice title=Virtualization::KVM is not available on this runner"
          fi
      - name: Create a token for the ByteLibrary CI App
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ByteLibrary
      - name: Check out the pull request into the workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ByteLibrary/workbench
          persist-credentials: false
      - name: Run setup without questions, installing everything itself
        env:
          BYTELIBRARY_GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          BYTELIBRARY_COMMIT_NAME: ByteLibrary CI
          BYTELIBRARY_COMMIT_EMAIL: ci@bytelibrary.invalid
        run: ByteLibrary/workbench/setup.sh </dev/null
  update-tests:
    name: Update tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the prerequisites from the README
        run: sudo apt-get install --yes python3-yaml
      - name: Test the workspace update
        run: scripts/test-update.sh
  machine:
    name: Machine through Multipass
    runs-on: ubuntu-24.04
    steps:
      - name: Install Multipass
        run: |
          sudo snap install multipass
          # The service takes a moment to accept requests after installing.
          for _ in $(seq 30); do sudo multipass version >/dev/null 2>&1 && break; sleep 2; done
          sudo multipass version
      - name: Create a machine
        run: |
          # Docker, preinstalled on the runner, drops forwarded traffic, which would leave the machine
          # without a network; a developer's computer has no such rule.
          sudo iptables -P FORWARD ACCEPT
          # Right after installing, Multipass may not have loaded its image catalogue yet.
          for _ in $(seq 30); do sudo multipass find 24.04 >/dev/null 2>&1 && break; sleep 5; done
          if ! output="$(sudo multipass launch 24.04 --name ci-machine --cpus 2 --memory 2G --disk 10G --timeout 900 2>&1)"; then
            echo "::error title=multipass launch::$(tail -3 <<<"$output" | tr '\n' ' ')"
            exit 1
          fi
      - name: Announce its name on the local network, as setup does
        run: sudo multipass exec ci-machine -- sudo apt-get install --yes --quiet avahi-daemon
      - name: Resolve .local names on the runner, as a Linux computer does
        run: sudo apt-get install --yes --quiet avahi-daemon libnss-mdns
      - name: The machine is reachable by name over SSH's port
        run: |
          getent hosts ci-machine.local
          nc -z -w 10 ci-machine.local 22
          echo "::notice title=Machine by name::ci-machine.local resolves and its SSH port is reachable"
