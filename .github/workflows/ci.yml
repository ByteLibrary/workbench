name: CI

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  compliance:
    name: Shared
    uses: ByteLibrary/reusable-ci-workflows/.github/workflows/compliance.yml@main
  lint:
    name: Shared
    uses: ByteLibrary/reusable-ci-workflows/.github/workflows/lint.yml@main
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the rules the hooks call
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ByteLibrary/reusable-ci-workflows
          path: .rules
          persist-credentials: false
      - name: Install the prerequisites from the README
        run: sudo apt-get install --yes python3-yaml
      - name: Install mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Run the tests
        env:
          RULES_REPOSITORY: .rules
        run: mise run test
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    # Pull requests from forks get no secrets, so they cannot create the CI App's token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      BYTELIBRARY_WORKSPACE_DIR: ${{ github.workspace }}/ByteLibrary
    steps:
      - name: Report whether the runner offers hardware virtualization
        run: |
          if [[ -e /dev/kvm ]]; then
            echo "::notice title=Virtualization::KVM is available on this runner (/dev/kvm exists)"
          else
            echo "::notice title=Virtualization::KVM is not available on this runner"
          fi
      - name: Create a token for the ByteLibrary CI App
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ByteLibrary
      - name: Check out the pull request into the workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ByteLibrary/workbench
          persist-credentials: false
      - name: Run setup without questions, installing everything itself
        env:
          BYTELIBRARY_GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          BYTELIBRARY_COMMIT_NAME: ByteLibrary CI
          BYTELIBRARY_COMMIT_EMAIL: ci@bytelibrary.invalid
        run: |
          # Shows setup's warnings and last line on the pull request when it fails.
          set -o pipefail
          trap 'echo "::error title=setup.sh::$( (grep -F "!!" setup.log; tail -1 setup.log) | sed "s/\x1b\[[0-9;]*m//g" | tr "\n" " ")"' ERR
          ByteLibrary/workbench/setup.sh </dev/null 2>&1 | tee setup.log
  readme-steps:
    name: README steps
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Pull requests from forks get no secrets, so they cannot create the CI App's token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Prepare the runner like a developer's computer
        run: |
          sudo snap install multipass
          # The service takes a moment to accept requests after installing.
          for _ in $(seq 30); do sudo multipass version >/dev/null 2>&1 && break; sleep 2; done
          # Docker, preinstalled on the runner, drops forwarded traffic, which would leave the machine
          # without a network; a developer's computer has no such rule.
          sudo iptables -P FORWARD ACCEPT
          # Right after installing, Multipass may not have loaded its image catalogue yet.
          for _ in $(seq 30); do sudo multipass find 24.04 >/dev/null 2>&1 && break; sleep 5; done
          # A Linux computer resolves .local names through mDNS.
          sudo apt-get install --yes --quiet avahi-daemon libnss-mdns
          mkdir -p "$HOME/.ssh"
          ssh-keygen -t ed25519 -N "" -q -f "$HOME/.ssh/id_ed25519"
      - name: "Step 1: create the machine (smaller than the README's, to fit the runner)"
        run: |
          if ! output="$(sudo multipass launch 24.04 --name bytelibrary --cpus 2 --memory 4G --disk 20G --timeout 900 2>&1)"; then
            echo "::error title=multipass launch::$(tail -3 <<<"$output" | tr '\n' ' ')"
            exit 1
          fi
      - name: "Step 2: give it the SSH key"
        run: sudo multipass exec bytelibrary -- sh -c "echo '$(cat $HOME/.ssh/id_ed25519.pub)' > /home/ubuntu/editor-ssh-key.pub"
      - name: Create a token for the ByteLibrary CI App
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ByteLibrary
      - name: "Step 3: inside the machine, clone this pull request and run setup without questions"
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          # Shows setup's warnings and last line on the pull request when it fails.
          set -o pipefail
          trap 'echo "::error title=setup.sh::$( (grep -F "!!" setup.log; tail -1 setup.log) | sed "s/\x1b\[[0-9;]*m//g" | tr "\n" " ")"' ERR
          sudo multipass exec bytelibrary -- env BYTELIBRARY_GITHUB_TOKEN="$TOKEN" \
            BYTELIBRARY_COMMIT_NAME="ByteLibrary CI" BYTELIBRARY_COMMIT_EMAIL=ci@bytelibrary.invalid COMMIT="$COMMIT" \
            bash -c 'git clone --quiet https://github.com/ByteLibrary/workbench.git ~/ByteLibrary/workbench &&
              git -C ~/ByteLibrary/workbench checkout --quiet "$COMMIT" &&
              ~/ByteLibrary/workbench/setup.sh </dev/null' 2>&1 | tee setup.log
      - name: "Step 4: connect over SSH to bytelibrary.local, as the editor does"
        run: |
          printf 'Host bytelibrary\n  HostName bytelibrary.local\n  User ubuntu\n  StrictHostKeyChecking accept-new\n' >>"$HOME/.ssh/config"
          ssh bytelibrary 'test -d ~/ByteLibrary/handbook/.git && test -x ~/.local/bin/playbook && docker info >/dev/null'
          echo "::notice title=README steps::Steps 1 to 4 work: the machine is set up, and reached by name over SSH"
      - name: "The firewall allows only listed sites, from the machine and from containers"
        run: |
          # Runs in the machine; prints each check, and fails on the first one that does not hold.
          if ! output="$(ssh bytelibrary 'bash -s' 2>&1 <<'CHECKS'
          set -uo pipefail
          expect() { if eval "$2" >/dev/null 2>&1; then echo "ok   $1"; else echo "FAIL $1"; exit 1; fi; }
          expect "an allowed site is reachable" "curl -fsS --max-time 15 https://github.com"
          expect "a site not on the list is blocked" "! curl -sS --max-time 10 https://example.com"
          expect "an address not looked up through the resolver is blocked" "! curl -sS --max-time 10 http://1.1.1.1"
          expect "a container reaches an allowed site" "docker run --rm curlimages/curl -fsS --max-time 15 https://github.com"
          expect "a container is blocked from a site not on the list" "! docker run --rm curlimages/curl -sS --max-time 10 https://example.com"
          expect "containers reach each other" "docker network create firewall-test && docker run -d --rm --name firewall-web --network firewall-test nginx:alpine && sleep 2 && docker run --rm --network firewall-test curlimages/curl -fsS --max-time 10 http://firewall-web"
          expect "the blocked site is reported" "~/ByteLibrary/workbench/scripts/firewall.sh blocked | grep -q example.com"
          echo example.com >>~/.config/bytelibrary/allowed-sites
          sleep 5
          expect "a site in the personal file is reachable" "curl -fsS --max-time 15 https://example.com"
          expect "the doctor reports a stopped firewall" "sudo systemctl stop bytelibrary-firewall.service bytelibrary-dns.service && ! ~/ByteLibrary/workbench/scripts/doctor.sh"
          CHECKS
          )"; then
            echo "$output"
            echo "::error title=Firewall::$(grep FAIL <<<"$output" | tr '\n' ' ')"
            exit 1
          fi
          echo "$output"
